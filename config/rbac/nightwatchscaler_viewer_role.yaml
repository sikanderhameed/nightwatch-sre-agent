# This rule is not used by the project nightwatch-ai itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to finops.sikander.io resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: nightwatch-ai
    app.kubernetes.io/managed-by: kustomize
  name: nightwatchscaler-viewer-role
rules:
- apiGroups:
  - finops.sikander.io
  resources:
  - nightwatchscalers
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - finops.sikander.io
  resources:
  - nightwatchscalers/status
  verbs:
  - get
