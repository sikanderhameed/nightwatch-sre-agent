# This rule is not used by the project nightwatch-ai itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over finops.sikander.io.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: nightwatch-ai
    app.kubernetes.io/managed-by: kustomize
  name: nightwatchscaler-admin-role
rules:
- apiGroups:
  - finops.sikander.io
  resources:
  - nightwatchscalers
  verbs:
  - '*'
- apiGroups:
  - finops.sikander.io
  resources:
  - nightwatchscalers/status
  verbs:
  - get
